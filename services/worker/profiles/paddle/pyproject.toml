[project]
name = "study-agent-paddle-profile"
version = "0.1.0"
description = "Isolated Apple Silicon OCR runtime for the study agent worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1",
  "paddlex[ocr]==3.7.2",
  "pillow>=12.3,<13",
]

[project.scripts]
study-agent-paddle-profile = "study_worker_paddle.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_worker_paddle"]
