[project]
name = "study-agent-docling-profile"
version = "0.1.0"
description = "Isolated Docling standard and VLM runtime for the study agent worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docling==2.117.0",
  "pypdf>=6.0,<7",
]

[project.scripts]
study-agent-docling-profile = "study_worker_docling.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_worker_docling"]
